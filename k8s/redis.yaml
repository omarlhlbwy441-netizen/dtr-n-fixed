apiVersion: apps/v1
kind: Deployment
metadata:
  name: rafeeq-redis
  namespace: rafeeq
  labels:
    app: rafeeq
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rafeeq
      component: redis
  template:
    metadata:
      labels:
        app: rafeeq
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: rafeeq
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
