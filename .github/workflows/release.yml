name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Rafeeq Kernel ${{ github.ref }}
          body: |
            ## Rafeeq Kernel Release
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false
