services:
  - type: web
    name: dtr-n
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: dtr-n-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USER
        value: omarlhlbwy441-netizen
      - key: GITHUB_REPO
        value: omarlhlbwy441-netizen/dtr-n-fixed
      - key: APP_VERSION
        value: "2.3.0"
      - key: MOBILE_UPDATE_CHANNEL
        value: "stable"

databases:
  - name: dtr-n-db
    plan: free
    ipAllowList: []
