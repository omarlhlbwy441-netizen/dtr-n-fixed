[tox]
envlist = py311, lint, security

[testenv]
deps = 
    pytest
    pytest-asyncio
    pytest-cov
    httpx
    black
    flake8
    bandit
    safety
commands = 
    pytest {posargs}

[testenv:lint]
deps = 
    black
    flake8
    isort
    mypy
commands = 
    black --check .
    flake8 .
    isort --check-only .

[testenv:security]
deps = 
    bandit
    safety
commands = 
    bandit -r . -f json -o bandit-report.json
    safety check

[testenv:coverage]
deps = 
    pytest
    pytest-cov
commands = 
    pytest --cov=. --cov-report=html --cov-report=term
