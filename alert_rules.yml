# ═══════════════════════════════════════════════════════════════════
# Rafeeq Kernel v2.3.0 — Prometheus Alert Rules
# ═══════════════════════════════════════════════════════════════════

groups:
  - name: rafeeq-alerts
    rules:
      # ─── API Down ──────────────────────────────────────────────
      - alert: RafeeqAPIDown
        expr: up{job="rafeeq-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rafeeq API is down"
          description: "Rafeeq API has been down for more than 1 minute"

      # ─── High Error Rate ───────────────────────────────────────
      - alert: RafeeqHighErrorRate
        expr: rate(rafeeq_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10% for the last 5 minutes"

      # ─── High Response Time ──────────────────────────────────
      - alert: RafeeqHighLatency
        expr: histogram_quantile(0.95, rate(rafeeq_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "95th percentile latency is above 2 seconds"

      # ─── Database Connection Issues ────────────────────────────
      - alert: RafeeqDBDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter is not responding"

      # ─── Redis Down ──────────────────────────────────────────
      - alert: RafeeqRedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter is not responding"

      # ─── High Memory Usage ─────────────────────────────────────
      - alert: RafeeqHighMemory
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85%"

      # ─── High CPU Usage ──────────────────────────────────────
      - alert: RafeeqHighCPU
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80%"

      # ─── Disk Space Low ──────────────────────────────────────
      - alert: RafeeqDiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10%"
